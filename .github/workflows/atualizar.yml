name: Atualizar dados

on:
  schedule:
    - cron: "15 9 * * 2-6"   # 06:15 em Brasilia, de terca a sabado
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["radar/**", "config.yaml", "requirements.txt", ".github/workflows/atualizar.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Recuperar banco da coleta anterior
        uses: actions/cache@v4
        with:
          path: dados
          key: dados-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dados-${{ github.ref_name }}-
            dados-
      - name: Coletar
        run: |
          mkdir -p docs
          {
            date -u "+Coleta iniciada em %Y-%m-%d %H:%M UTC"
            python -m radar diagnostico || true
            python -m radar coletar || true
            python -m radar status || true
          } 2>&1 | tee docs/coleta.log
      - name: Calcular notas e exportar
        run: |
          set -o pipefail
          python -m radar exportar 2>&1 | tee -a docs/coleta.log
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Atualiza dados da coleta"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
      - name: Alertas por Telegram (se configurado)
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m radar alertas
      - name: Avisar falha da coleta
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          falhas="$(python -m radar falhas || true)"
          if [ "${{ job.status }}" != "success" ]; then
            falhas="${falhas}"$'\n'"- a etapa de calculo ou publicacao falhou; o painel continua com os dados anteriores"
          fi
          [ -z "$falhas" ] && { echo "sem falhas"; exit 0; }
          corpo="Coleta de $(date -u +%Y-%m-%d) com problema. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n\n'"${falhas}"
          numero="$(gh issue list --state open --search 'Coleta com problema in:title' --json number --jq '.[0].number')"
          if [ -n "$numero" ]; then gh issue comment "$numero" --body "$corpo"; else gh issue create --title "Coleta com problema" --body "$corpo"; fi
